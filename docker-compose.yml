services:
  java-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: codealpha-java-app:1.0.0
    container_name: codealpha-java-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
        reservations:
          cpus: '0.20'
          memory: 128M
