name: Java Gradle CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==============================================================================
  # Job 1: Build & Test with Gradle
  # ==============================================================================
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests with Gradle
        run: gradle test --info

      - name: Generate JaCoCo Code Coverage Report
        run: gradle jacocoTestReport

      - name: Build JAR Package
        run: gradle build -x test

      - name: Upload Build Artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: build/libs/*.jar
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: build/reports/tests/test/
          retention-days: 7

  # ==============================================================================
  # Job 2: Containerize & Verify Docker Build
  # ==============================================================================
  docker-package:
    name: Build & Verify Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: codealpha-java-app:latest
          load: true

      - name: Test Run Docker Container
        run: |
          docker run -d --name test-java-app -p 8080:8080 codealpha-java-app:latest
          sleep 5
          curl -f http://localhost:8080/api/health || exit 1
          echo "Health check passed in CI pipeline!"
          docker stop test-java-app
